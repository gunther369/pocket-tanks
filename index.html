<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Tanks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="game-wrapper">
  <div id="hud">
    <div class="player-info">
      <div class="player-avatar p1-av">P1</div>
      <span class="player-name p1-color" id="p1-name">PLAYER 1</span>
      <span class="score-text p1-color" id="p1-score">0</span>
    </div>
    <div id="wind-display">
      <span class="wind-label">WIND</span>
      <span class="wind-val" id="wind-val">Calm</span>
      <span class="round-label" id="round-label">RD 1/10</span>
    </div>
    <div class="player-info right">
      <span class="score-text p2-color" id="p2-score">0</span>
      <span class="player-name p2-color" id="p2-name">PLAYER 2</span>
      <div class="player-avatar p2-av">P2</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="1200" height="600"></canvas>
    <div id="turn-banner"></div>

    <div id="mode-overlay">
      <div class="title-glow"></div>
      <h1>POCKET TANKS</h1>
      <p class="subtitle">Artillery duel &mdash; destroy your opponent!</p>
      <div class="mode-buttons">
        <button class="mode-btn" id="btn-2p">
          <span class="mode-icon">&#9872;</span>2 Players
        </button>
        <button class="mode-btn" id="btn-cpu">
          <span class="mode-icon">&#9881;</span>vs CPU
        </button>
        <button class="mode-btn" id="btn-campaign">
          <span class="mode-icon">&#9876;</span>Campaign
        </button>
      </div>
      <button class="settings-gear" id="btn-settings" title="Settings">&#9881;</button>
    </div>

    <div id="name-overlay">
      <h2 id="name-screen-title">ENTER NAMES</h2>
      <div class="name-inputs">
        <div class="name-field">
          <input id="p1-name-input" class="name-input p1-border" type="text" maxlength="12" placeholder="Player 1" spellcheck="false">
        </div>
        <span class="name-vs">VS</span>
        <div class="name-field" id="p2-name-field">
          <input id="p2-name-input" class="name-input p2-border" type="text" maxlength="12" placeholder="Player 2" spellcheck="false">
          <span id="p2-fixed-label" class="name-fixed-label p2-color">CPU</span>
        </div>
      </div>
      <div class="name-actions">
        <button class="mode-btn name-back-btn" id="btn-back">&#8592; Back</button>
        <button class="mode-btn name-start-btn" id="btn-start">Start &#9654;</button>
      </div>
    </div>

    <div id="draft-overlay">
      <h2 class="overlay-title">WEAPON DRAFT</h2>
      <div class="draft-info">
        <div class="draft-player active" id="draft-p1"><span class="draft-pname p1-color" id="draft-p1-name">P1</span><span class="draft-pcount" id="draft-p1-count">0/10</span></div>
        <div class="draft-turn-label" id="draft-turn-label">Pick a weapon!</div>
        <div class="draft-player" id="draft-p2"><span class="draft-pname p2-color" id="draft-p2-name">P2</span><span class="draft-pcount" id="draft-p2-count">0/10</span></div>
      </div>
      <div id="draft-grid"></div>
    </div>

    <div id="campaign-overlay">
      <h2 class="overlay-title">CAMPAIGN</h2>
      <div id="campaign-card">
        <div class="campaign-level" id="campaign-level">LEVEL 1</div>
        <div class="campaign-opp-name" id="campaign-opp-name"></div>
        <div class="campaign-opp-title" id="campaign-opp-title"></div>
        <div class="campaign-opp-desc" id="campaign-opp-desc"></div>
        <div class="campaign-diff" id="campaign-diff"></div>
      </div>
      <div class="name-actions">
        <button class="mode-btn name-back-btn" id="btn-campaign-back">&#8592; Back</button>
        <button class="mode-btn name-start-btn" id="btn-campaign-fight">Fight &#9876;</button>
      </div>
    </div>

    <div id="settings-overlay">
      <h2 class="overlay-title">SETTINGS</h2>
      <div class="settings-body">
        <div class="setting-row"><span class="setting-label">Rounds</span><div class="setting-opts" id="set-rounds"><button data-val="5">5</button><button data-val="10" class="active">10</button><button data-val="15">15</button></div></div>
        <div class="setting-row"><span class="setting-label">Sound</span><div class="setting-opts" id="set-sound"><button data-val="1" class="active">On</button><button data-val="0">Off</button></div></div>
        <div class="setting-row"><span class="setting-label">Gravity</span><div class="setting-opts" id="set-gravity"><button data-val="0.5">Moon</button><button data-val="1" class="active">Normal</button><button data-val="1.5">Heavy</button></div></div>
        <div class="setting-row"><span class="setting-label">Weapons</span><div class="setting-opts" id="set-draft"><button data-val="0" class="active">Draft</button><button data-val="1">Auto</button></div></div>
      </div>
      <button class="mode-btn name-start-btn" id="btn-settings-done">Done</button>
    </div>

    <div id="game-over-overlay">
      <h2 id="winner-text"></h2>
      <div class="score-line" id="score-line"></div>
      <div class="go-buttons">
        <button id="restart-btn">NEW GAME</button>
        <button id="campaign-next-btn" style="display:none">NEXT &#9654;</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="ctrl-row">
      <div class="ctrl-group weapons-group">
        <label>Weapon</label>
        <select id="weapon-select"></select>
      </div>
      <div class="sep"></div>
      <div class="ctrl-group">
        <label>Angle</label>
        <div class="adjuster">
          <button class="adj-btn" id="ang-dn">&#9664;</button>
          <span class="ctrl-val" id="ang-val">45</span><span class="ctrl-unit">&deg;</span>
          <button class="adj-btn" id="ang-up">&#9654;</button>
        </div>
      </div>
      <div class="sep"></div>
      <div class="ctrl-group">
        <label>Power</label>
        <div class="adjuster">
          <button class="adj-btn" id="pow-dn">&#9660;</button>
          <span class="ctrl-val" id="pow-val">50</span><span class="ctrl-unit">%</span>
          <button class="adj-btn" id="pow-up">&#9650;</button>
        </div>
      </div>
      <div class="sep"></div>
      <div class="ctrl-group">
        <label>Move</label>
        <div class="adjuster">
          <button class="adj-btn move-btn" id="move-left">&#9664;</button>
          <span class="ctrl-val" id="move-counter">5</span>
          <button class="adj-btn move-btn" id="move-right">&#9654;</button>
        </div>
      </div>
      <div class="sep"></div>
      <div class="ctrl-group">
        <button id="fire-btn">&#9888; FIRE</button>
      </div>
    </div>
    <div class="keys-hint">
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> angle
      <kbd>&uarr;</kbd><kbd>&darr;</kbd> power
      <kbd>A</kbd><kbd>D</kbd> move
      <kbd>Q</kbd><kbd>E</kbd> weapon
      <kbd>Space</kbd> fire
    </div>
  </div>
</div>
<script src="game.js?v=5"></script>
</body>
</html>
